GPUS: '0'
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 8
PRINT_FREQ: 100
EXP_NAME: 'demo'
DATASET:
  DATASET: h36m
  ROOT: 'data/h36m/'
  TEST_SET: val
  TRAIN_SET: train
  NUM_CAMS: 4
  OCCLUSION: True
  VOC: 'VOC2012' # If you want to use synthetic occlusion, please enter the VOC path
  AUGMENT: True
MODEL:
  NAME: gcn_end_to_end
  BACKBONE: resnext101_32x8d
  INIT_WEIGHTS: True # set this to true to use ImageNet pre-trained models
  RESUME: 'checkpoint.pth.tar'
  CKPT_2D: 'output/h36m/pose3d_vol/demo/2021-05-21-15-32-18/model_best.pth.tar'     # if TIME_STR is set, we load that instead
  CKPT_3D: 'output/h36m/pose3d_sem_gcn/demo/2021-06-05-17-35-51/model_best.pth.tar'
  TIME_STR: ''
  NUM_JOINTS: 17
  DEPTH_RES: 64 # 64 for 3d loss calculation, 1 for 2d
  FREEZE_BACKBONE_COMPLETELY: False
  VOLUME:
    FINAL_CONV_KERNEL: 1
    DECONV_WITH_BIAS: false
    NUM_DECONV_LAYERS: 3
    NUM_DECONV_FILTERS: 256
    BN_MOMENTUM: 0.1
  SEM_GCN:
    HID_DIM: 128
    NUM_LAYERS: 4
    DROPOUT: 0.0
    INPUT_JOINT_DIM: 2

LOSS:
  FN: 'L1JointRegressionLoss'
TRAIN:
  BATCH_SIZE: 16
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 400
  OPTIMIZER: adam
  LR: 0.0001
  LR_FACTOR: 0.1
  LR_STEP:
    - 90
    - 120
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE: 32
DEBUG:
  DEBUG: False # set this to true to visualize results in tensorboard
CPU: False  # TODO: does not work
