GPUS: '0'
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 8
PRINT_FREQ: 100
EXP_NAME: 'demo'
DATASET:
  DATASET: h36m
  ROOT: 'data/h36m/'
  TEST_SET: val
  TRAIN_SET: train
  NUM_CAMS: 4
MODEL:
  NAME: pose3d_resnext_reg
  INIT_WEIGHTS: True # set this to true, and PRETRAINED to your model file to use ImageNet pre-trained models
  DOWNLOAD_PRETRAINED: TRUE # true: downloads pretrained model and saves it in pretrained_data/checkpoints; false: use own own manually
  PRETRAINED: 'lib/models/pretrained_data/resnext_original.pth' # TODO: unused, work with TIME_STR for the folder instead
  TIME_STR: '' # uses most recent if not set
  RESUME: 'checkpoint.pth.tar'
  NUM_JOINTS: 17
LOSS:
  FN: 'L1JointRegressionLoss'
TRAIN:
  DEBUG_MODE: False
  BATCH_SIZE: 16
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 140
  OPTIMIZER: adam
  LR: 0.0001
  LR_FACTOR: 0.1
  LR_STEP:
  - 90
  - 120
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE: 16
DEBUG:
  DEBUG: False # set this to true to visualize results in tensorboard
