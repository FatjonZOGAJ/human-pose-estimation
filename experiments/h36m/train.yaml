GPUS: '0'
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 8
PRINT_FREQ: 100
EXP_NAME: 'demo'
DATASET:
  DATASET: h36m
  ROOT: 'data/h36m/'
  TEST_SET: val
  TRAIN_SET: train
  NUM_CAMS: 4
MODEL:
  NAME: pose3d_resnet_vol
  INIT_WEIGHTS: True # set this to true to use ImageNet pre-trained models
  RESUME: 'checkpoint.pth.tar'
  NUM_JOINTS: 17
  DEPTH_RES: 64
  VOLUME:
    FINAL_CONV_KERNEL: 1
    DECONV_WITH_BIAS: false
    NUM_DECONV_LAYERS: 3
    NUM_DECONV_FILTERS: 256
    LAYER_CONFIG:
      - 4
      - 1
      - 0
    BN_MOMENTUM: 0.1
LOSS:
  FN: 'L1JointRegressionLoss'
TRAIN:
  BATCH_SIZE: 16
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 140
  OPTIMIZER: adam
  LR: 0.0001
  LR_FACTOR: 0.1
  LR_STEP:
  - 90
  - 120
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE: 32
DEBUG:
  DEBUG: FALSE # set this to true to visualize results in tensorboard
